; PlatformIO Configuration for XIAO ESP32S3 Camera Module
; Uses Custom Board Definition + espressif32 platform

[env:xiao-esp32-s3-cam]
platform = espressif32
board = xiaoxiao-cam-v1.0
framework = arduino
lib_deps =
    esp32/esp-arduino@^5.1.1

build_flags =
    -D XIAO_ESP32_S3_CAM_MODULE
    -D ESP32_CAMERA_ESP_PORT=Serial

monitor_speed = 115200
upload_speed = 921600
board_upload_partitions =

; Partition scheme for bootloader + sketch
build partition_file = partitions_Bootloader.csv
