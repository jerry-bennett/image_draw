; Alternative PlatformIO Configuration for XIAO ESP32S3 Camera
; Uses esp32-s3-devkit board variant (more commonly available)

[env:xiao-esp32-s3-cam-alt]
platform = espressif32
board = esp32-s3-devkit
framework = arduino

build_flags =
    -D XIAO_ESP32_S3_CAM_MODULE

monitor_speed = 115200
upload_speed = 921600
board_upload_partitions =

; Partition scheme for bootloader + sketch
build partition_file = partitions_Bootloader.csv
